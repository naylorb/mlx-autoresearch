[project]
name = "autoresearch-mlx-dlx"
version = "0.1.0"
description = "Autonomous pretraining research — native Apple Silicon with MLX"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "naylorb" },
]
dependencies = [
    "mlx==0.31.1",
    "numpy==2.2.6",
    "pyarrow==21.0.0",
    "requests==2.32.3",
    "rustbpe==0.1.0",
    "tiktoken==0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "metal: requires Apple Silicon with MLX/Metal (deselect with '-m not metal')",
]

[project.urls]
Repository = "https://github.com/naylorb/mlx-autoresearch"
